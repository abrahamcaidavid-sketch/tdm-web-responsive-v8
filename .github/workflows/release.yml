name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Optional safety check; leave empty to use VERSION"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Validate version
        id: metadata
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          if [[ ! "$version" =~ ^8\.0\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid VERSION: $version" >&2
            exit 1
          fi
          if [[ -n "$REQUESTED_VERSION" && "$REQUESTED_VERSION" != "$version" ]]; then
            echo "Requested version does not match VERSION" >&2
            exit 1
          fi
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag already exists: $tag" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Run static tests
        run: python -m unittest discover -s addons/tdm_web_responsive_v8/tests -p "test_*.py" -v

      - name: Check JavaScript syntax
        run: node --check addons/tdm_web_responsive_v8/static/src/js/responsive.js

      - name: Build deterministic release files
        run: |
          python scripts/build_release.py \
            --expected-version "${{ steps.metadata.outputs.version }}"
          (cd dist && sha256sum --check *.sha256)

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.metadata.outputs.tag }}
          VERSION: ${{ steps.metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "TDM Web Responsive for Odoo 8 $VERSION" \
            --generate-notes \
            --latest
