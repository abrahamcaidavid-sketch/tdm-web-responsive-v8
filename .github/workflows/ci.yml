name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Run static tests
        run: python -m unittest discover -s addons/tdm_web_responsive_v8/tests -p "test_*.py" -v

      - name: Check JavaScript syntax
        run: node --check addons/tdm_web_responsive_v8/static/src/js/responsive.js

      - name: Build deterministic release files twice
        run: |
          python scripts/build_release.py --output-dir dist/first
          python scripts/build_release.py --output-dir dist/second
          cmp dist/first/*.zip dist/second/*.zip
          (cd dist/first && sha256sum --check *.sha256)

      - name: Upload validated package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tdm-web-responsive-v8
          path: dist/first/*
          if-no-files-found: error
